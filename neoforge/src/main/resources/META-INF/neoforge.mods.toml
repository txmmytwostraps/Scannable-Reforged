modLoader = "javafml"
loaderVersion = "[${loaderVersion},)"
issueTrackerURL = "https://github.com/txmmytwostraps/Scannable-Reforged/issues"
license = "MIT"

[[mods]]
modId = "scannable"
version = "${version}"
displayName = "Scannable Reforged"
displayURL = "https://github.com/txmmytwostraps/Scannable-Reforged"
logoFile = "logo.png"
authors = "Sangar (original author), txmmytwostraps (NeoForge 1.21.1 port)"
credits = 'Fork of Scannable by Florian "Sangar" Nücke (MightyPirates). Original: https://github.com/MightyPirates/Scannable'
description = '''
Scan the area for points of interest. Unofficial NeoForge 1.21.1 fork of Scannable by Florian "Sangar" Nücke.
'''

# Floor is the 1.21.1 NeoForge baseline, NOT the (newer) version we compile against, so the mod loads
# on packs shipping any 1.21.1 NeoForge (e.g. ATM10 on 21.1.228). 21.1.x patch releases are
# API-compatible and the mod uses no newer-than-baseline runtime APIs.
[[dependencies.scannable]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.scannable]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftVersion}"
ordering = "NONE"
side = "BOTH"

[[dependencies.scannable]]
modId = "architectury"
type = "required"
versionRange = "[${architecturyVersion},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "scannable-common.mixins.json"

[[mixins]]
config = "scannable.mixins.json"
