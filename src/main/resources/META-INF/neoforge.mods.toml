modLoader = "javafml"
loaderVersion = "[${loaderVersion},)"
issueTrackerURL = "https://github.com/txmmytwostraps/Scannable-Reforged/issues"
license = "MIT"

[[mods]]
modId = "scannable"
version = "${version}"
displayName = "Scannable Reforged"
displayURL = "https://github.com/txmmytwostraps/Scannable-Reforged"
logoFile = "logo.png"
authors = "Sangar (original author), txmmytwostraps (NeoForge 26.1.2 port)"
credits = 'Fork of Scannable by Florian "Sangar" Nücke (MightyPirates). Original: https://github.com/MightyPirates/Scannable'
description = '''
Scan the area for points of interest. Unofficial NeoForge 26.1.2 fork of Scannable by Florian "Sangar" Nücke.
'''

# Floor is the 26.1.2 NeoForge baseline, NOT the (newer) version we compile against, so the mod loads
# on any 26.1.2 pack's NeoForge build (e.g. ATM11 on 26.1.2.71). The minecraft = 26.1.2 pin below keeps
# it locked to the right MC version; 26.1.2.x patch releases are API-compatible.
[[dependencies.scannable]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.scannable]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftVersion}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "scannable-common.mixins.json"

[[mixins]]
config = "scannable.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
